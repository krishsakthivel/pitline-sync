name: Pitline Sync

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # 6 hour cap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pitlinev5 psycopg2-binary

      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBOTEVENTS_TOKEN: ${{ secrets.ROBOTEVENTS_TOKEN }}
        run: python worker/sync.py

  elo:
    runs-on: ubuntu-latest
    needs: sync              # runs after sync completes
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Compute ELO
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python worker/elo_sync.py
